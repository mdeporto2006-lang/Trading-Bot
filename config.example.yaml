# Copy to config.yaml and edit. Anything left out uses the default shown here.

trading:
  mode: paper            # dry_run (log only) | paper (Alpaca paper) | live (real money, see .env.example)
  data_feed: iex         # iex (free) or sip (paid Alpaca data plan)
  watchlist: [AAPL, NVDA, TSLA, AMD]
  journal_path: journal/trades.jsonl

setup:                   # the checklist; every item must pass
  catalyst_max_age_hours: 24
  min_relative_volume: 2.0          # today's volume pace vs 20-day average
  relative_volume_lookback_days: 20
  min_avg_daily_volume: 1000000
  max_spread_pct: 0.10              # percent, so 0.10 = 0.1%
  min_reward_risk: 2.0
  max_level_distance_atr: 1.5       # how close the stop level must be to entry

exits:                   # set at entry, never widened
  atr_period: 14
  stop_atr_multiple: 1.5
  target_r_multiple: 2.0
  trail_after_r: 1.0
  trail_distance_r: 1.0
  flatten_time_et: "15:50"

session:
  no_entries_before_et: "09:45"
  no_entries_after_et: "15:30"
  manage_interval_seconds: 30
  scan_interval_seconds: 300        # each scan makes one Claude call per ticker that has full data

risk:
  risk_per_trade_pct: 0.5           # % of equity lost if the stop is hit
  max_position_pct: 20
  max_open_positions: 3
  max_trades_per_day: 5
  daily_loss_limit_pct: 2.0
  min_confidence: 0.6
  entry_limit_slippage_pct: 0.10

planner:
  model: claude-opus-5-5
  effort: high
  max_tokens: 16000
  use_refusal_fallbacks: true
