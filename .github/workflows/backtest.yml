name: Backtest

# Rules-only backtest on free Yahoo data. No API keys, no Claude calls, no orders.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, space separated"
        default: "AAPL NVDA TSLA AMD"
      days:
        description: "Trading days to test (Yahoo has ~30 days of minute bars)"
        default: "20"
  push:
    branches: [claude/project-thread-rbkzy2]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Backtest (rules planner, Yahoo data)
        env:
          TICKERS: ${{ inputs.tickers || 'AAPL NVDA TSLA AMD' }}
          DAYS: ${{ inputs.days || '20' }}
        run: |
          set -o pipefail
          python -m tradebot -v backtest $TICKERS --days "$DAYS" --source yahoo --planner rules 2> >(tee backtest.log >&2) | tee summary.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Backtest (rules planner, Yahoo data)'
            echo '```'
            cat summary.txt 2>/dev/null || echo "no summary"
            echo '```'
            echo '<details><summary>log</summary>'
            echo
            echo '```'
            tail -n 60 backtest.log 2>/dev/null
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: |
            backtests/
            summary.txt
            backtest.log
          if-no-files-found: warn
