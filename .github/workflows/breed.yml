name: Breed

# Bot breeder: evolves futures day-trading bots on free Yahoo data, rules only.
# No API keys, no Claude calls, no orders. Results: the job summary and the
# "breeder-run" artifact (tree.html opens on its own in a browser).
on:
  workflow_dispatch:
    inputs:
      generations:
        description: "Generations per run"
        default: "50"
      population:
        description: "Bots per generation"
        default: "100"
      seeds:
        description: "Independent breeding runs (champion picked on validate days)"
        default: "3"
      interval:
        description: "Bar size in minutes: 5 (~60 days of data) or 1 (~30 days)"
        default: "5"
  push:
    branches: [claude/project-thread-popur6]
    paths:
      - "tradebot/breeder/**"
      - ".github/workflows/breed.yml"

permissions:
  contents: write  # to save the latest run under docs/breeder/ for the dashboard

jobs:
  breed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Breed (Yahoo futures data)
        env:
          GENS: ${{ inputs.generations || '50' }}
          POP: ${{ inputs.population || '100' }}
          SEEDS: ${{ inputs.seeds || '3' }}
          INTERVAL: ${{ inputs.interval || '5' }}
        run: |
          set -o pipefail
          python -m tradebot breed --source yahoo --interval "$INTERVAL" --generations "$GENS" \
            --population "$POP" --seeds "$SEEDS" --out breeder_runs 2> >(tee breed.log >&2)
      - name: Job summary
        if: always()
        run: |
          {
            cat breeder_runs/summary.md 2>/dev/null || echo "## Breed: no summary (see log)"
            echo '<details><summary>log</summary>'
            echo
            echo '```'
            tail -n 80 breed.log 2>/dev/null
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the run to docs/breeder (the dashboard's /breeder page reads it)
        if: success()
        continue-on-error: true
        run: |
          mkdir -p docs/breeder
          cp breeder_runs/latest.json breeder_runs/summary.md breeder_runs/tree.html docs/breeder/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/breeder
          git commit -m "Breeder run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breeder-run
          path: |
            breeder_runs/
            breed.log
          if-no-files-found: warn
